<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <defs>
    <pattern id="weave-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <!-- Modular weaving grid points evoking trama and urdimbre -->
      <rect x="0" y="0" width="20" height="20" fill="none"/>
      <path d="M 0,10 L 20,10 M 10,0 L 10,20" stroke="#5E2806" stroke-width="0.75" stroke-opacity="0.08"/>
      <rect x="8.5" y="8.5" width="3" height="3" fill="#F1A437" fill-opacity="0.2"/>
      <polygon points="10,0 20,10 10,20 0,10" fill="none" stroke="#DB3616" stroke-width="0.5" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="60" height="60" fill="url(#weave-pattern)"/>
</svg>